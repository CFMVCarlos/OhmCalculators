[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohmcalculators"
version = "0.1.0"
description = "Precision resistor value calculator and voltage divider tools with FastAPI web interface"
readme = "README.md"
authors = [
    { name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "httpx>=0.27.0",
    "pydoclint>=0.6.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "FIX",
    "TD",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]

[tool.pydoclint]
exclude = ".git|.tox|.venv|build|dist|.uv-cache|.ruff_cache"
skip-checking-short-docstrings = false
check-style-mismatch = true
check-arg-defaults = true
show-filenames-in-every-violation-message = true
check-class-attributes = false

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
