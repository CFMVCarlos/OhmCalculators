[project]
name = "ohmcalculators"
version = "0.1.0"
description = "Precision resistor value calculator and voltage divider tools with FastAPI web interface"
readme = "README.md"
authors = [
    { name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
