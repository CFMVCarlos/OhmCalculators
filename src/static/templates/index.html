<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhmCalculators</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // blue-500
                        primaryHover: '#2563eb', // blue-600
                    }
                }
            }
        }
    </script>
    <link href="/static/css/styles.css" rel="stylesheet">
    <!-- Load Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center justify-center py-10 px-4">

    <!-- Toast Notification Area -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <main class="w-full max-w-4xl bg-white shadow-xl rounded-2xl p-8 relative overflow-hidden" x-data="appData()">
        <!-- Background Pattern -->
        <div class="absolute inset-0 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] opacity-30 pointer-events-none"></div>

        <div class="relative z-10">
            <header class="mb-10 text-center">
                <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">OhmCalculators</h1>
                <p class="text-slate-500 mt-2 text-lg">Precision resistor and voltage calculations</p>
            </header>

            <!-- Tabs -->
            <div class="flex space-x-1 bg-slate-100 p-1 rounded-xl mb-8">
                <button 
                    @click="activeTab = 'missing'" 
                    :class="activeTab === 'missing' ? 'bg-white shadow text-slate-900' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'"
                    class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all">
                    Missing Parameter
                </button>
                <button 
                    @click="activeTab = 'parallel'" 
                    :class="activeTab === 'parallel' ? 'bg-white shadow text-slate-900' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'"
                    class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all">
                    Best Parallel
                </button>
                <button 
                    @click="activeTab = 'divider'" 
                    :class="activeTab === 'divider' ? 'bg-white shadow text-slate-900' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'"
                    class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all">
                    Divider Resistors
                </button>
            </div>

            <!-- Content Area -->
            <div class="min-h-[300px]">
                
                <!-- 1. Missing Parameter Form -->
                <div x-show="activeTab === 'missing'" x-transition.opacity.duration.300ms>
                    <form @submit.prevent="calculateMissing" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Vin (V)</label>
                                <input type="number" step="any" x-model.number="missingForm.vin" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none" placeholder="Leave empty to calculate">
                            </div>
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Vout (V)</label>
                                <input type="number" step="any" x-model.number="missingForm.vout" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none" placeholder="Leave empty to calculate">
                            </div>
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">R1 (Ω)</label>
                                <input type="number" step="any" x-model.number="missingForm.r1" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none" placeholder="Leave empty to calculate">
                            </div>
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">R2 (Ω)</label>
                                <input type="number" step="any" x-model.number="missingForm.r2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none" placeholder="Leave empty to calculate">
                            </div>
                        </div>
                        <button type="submit" :disabled="loading" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors disabled:opacity-70 flex justify-center items-center">
                            <span x-show="!loading">Calculate Missing Value</span>
                            <span x-show="loading" class="loader"></span>
                        </button>
                    </form>
                </div>

                <!-- 2. Best Parallel Form -->
                <div x-show="activeTab === 'parallel'" x-transition.opacity.duration.300ms style="display: none;">
                     <form @submit.prevent="calculateParallel" class="space-y-6">
                        <div class="input-group">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Target Resistance (Ω) <span class="text-red-500">*</span></label>
                            <input type="number" step="any" required x-model.number="parallelForm.target_value" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none" placeholder="e.g. 4700">
                        </div>
                        <button type="submit" :disabled="loading" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors disabled:opacity-70 flex justify-center items-center">
                            <span x-show="!loading">Find Best Combination</span>
                            <span x-show="loading" class="loader"></span>
                        </button>
                    </form>
                </div>

                <!-- 3. Divider Resistors Form -->
                <div x-show="activeTab === 'divider'" x-transition.opacity.duration.300ms style="display: none;">
                    <form @submit.prevent="calculateDividerResistors" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Vin (V) <span class="text-red-500">*</span></label>
                                <input type="number" step="any" required x-model.number="dividerForm.vin" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none">
                            </div>
                            <div class="input-group">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Vout (V) <span class="text-red-500">*</span></label>
                                <input type="number" step="any" required x-model.number="dividerForm.vout" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none">
                            </div>
                            <div class="input-group md:col-span-2">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Max Current (mA) <span class="text-red-500">*</span></label>
                                <input type="number" step="any" required x-model.number="dividerForm.maximum_current" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition outline-none">
                            </div>
                        </div>
                        <button type="submit" :disabled="loading" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors disabled:opacity-70 flex justify-center items-center">
                            <span x-show="!loading">Calculate Resistors</span>
                            <span x-show="loading" class="loader"></span>
                        </button>
                    </form>
                </div>

                <!-- Result Area -->
                <div x-show="result" x-transition.opacity.duration.300ms class="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-xl" style="display: none;">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 text-green-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Result
                    </h3>
                    
                    <div x-html="resultHtml" class="space-y-2 text-slate-700"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
